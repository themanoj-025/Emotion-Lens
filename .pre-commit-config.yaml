repos:
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix, --select, "E9,F,I"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        language: python
        types: [python]
        # Mirror the CI typecheck job's library surface: mypy verdicts
        # (incl. which type: ignore comments are "used") must match
        # between this hook and the typecheck workflow.
        additional_dependencies:
          - types-requests
          - slowapi
          - prometheus-client
          - numpy==2.4.6
          - streamlit==1.64.0
        args: [--ignore-missing-imports]
