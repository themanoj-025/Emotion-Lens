[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "UP", "SIM", "C4", "RUF", "PLC", "PIE", "I"]
ignore = [
    "DTZ005",  # datetime.now() without tz
    "UP024",   # replace aliased imports
    "B008",    # function call in defaults
    "SIM102",  # collapsible if
    "E501",    # line too long
    "BLE001",  # blind except — defensive coding
    "RUF012",  # mutable class default
    "PLC0415", # import-outside-top-level — lazy imports
    "RUF001",  # ambiguous unicode — intentional
    "E741",    # ambiguous variable name — legacy code
    "E402",    # module-import-not-at-top — intentional
    "RUF002",  # ambiguous unicode — intentional multiplication sign
    "RUF005",  # collection-literal-in-comparison
    "B904",    # raise-without-from — legacy code
    "B007",    # unused loop variable
    "B905",    # zip-without-strict
    "F821",    # undefined name — conditional imports (cv2, plotly, etc.)
    "F403",    # import-star — re-export pattern
    "F401",    # unused import — conditional availability check
    "SIM108",  # if-else-to-ternary — readability preference
    "RUF059",  # unused loop variable
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "-m 'not slow' -q"
testpaths = ["tests"]

markers = [
    "slow: integration tests (database, HTTP, ML models) — excluded from default run; use pytest -m slow"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true
